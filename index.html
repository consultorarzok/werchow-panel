<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Werchow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h1>Panel Werchow</h1>
    <p>Acceso interno &mdash; ingresá la clave para continuar</p>
    <input type="password" id="gate-input" placeholder="Clave" autocomplete="off">
    <button id="gate-btn">Entrar</button>
    <div class="gate-err" id="gate-err"></div>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>Werchow</h1>
        <span>CRM en vivo</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button data-view="resumen" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
        Resumen
      </button>
      <button data-view="comparar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="4" height="10"/><rect x="10" y="5" width="4" height="15"/><rect x="16" y="13" width="4" height="7"/></svg>
        Comparar
      </button>
      <button data-view="distribucion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 4"/></svg>
        Distribución
      </button>
      <button data-view="crm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 15h6"/></svg>
        Leads (CRM)
      </button>
    </nav>
    <div class="sidebar-foot">
      <div id="last-update">Actualizando&hellip;</div>
      <button id="refresh-btn"><span class="spin-icon" id="refresh-icon">↻</span> Actualizar ahora</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h2 id="topbar-title">Resumen</h2>
      <div class="topbar-right">
        <button class="emerg-chip" id="emerg-chip"><span class="emerg-dot"></span> <span id="emerg-count">0</span> emergencias pendientes</button>
        <div class="month-control">
          <label for="month-select">Mes</label>
          <select id="month-select"></select>
        </div>
      </div>
    </header>

    <div class="views">

      <section class="view active" id="view-resumen">
        <div class="kpis" id="kpi-row"></div>
        <h3 class="block-title">Evolución mensual</h3>
        <div class="chart-card">
          <canvas id="chart-trend"></canvas>
          <div class="chart-foot"><button class="link-btn" id="toggle-trend-table">Ver como tabla</button></div>
          <div id="trend-table-wrap" style="display:none"></div>
        </div>
      </section>

      <section class="view" id="view-comparar">
        <div class="view-head">
          <h3 class="block-title" style="margin:0">Leads por período</h3>
          <div class="seg" id="period-seg">
            <button data-period="month" class="active">Mensual</button>
            <button data-period="week">Semanal</button>
          </div>
        </div>
        <div class="chart-card">
          <canvas id="chart-period" style="max-height:420px"></canvas>
        </div>
      </section>

      <section class="view" id="view-distribucion">
        <h3 class="block-title">Distribución</h3>
        <div class="grid-3" style="margin-bottom:16px">
          <div class="chart-card">
            <h4>Motivo de consulta <span>· top</span></h4>
            <canvas id="chart-tipos"></canvas>
          </div>
          <div class="chart-card">
            <h4>Temperatura del lead</h4>
            <canvas id="chart-temp"></canvas>
          </div>
          <div class="chart-card">
            <h4>Localidades <span>· top</span></h4>
            <canvas id="chart-localidad"></canvas>
          </div>
        </div>
        <div class="grid-2-5">
          <div class="chart-card">
            <h4>Interesados en adhesión <span>· por categoría</span></h4>
            <div class="donut-wrap">
              <canvas id="chart-categoria"></canvas>
              <div class="donut-center" id="donut-categoria-center"></div>
            </div>
            <div class="donut-legend" id="donut-categoria-legend"></div>
          </div>
          <div class="chart-card">
            <h4>Interés en sepelio <span>· estado</span></h4>
            <div class="donut-wrap">
              <canvas id="chart-interes"></canvas>
              <div class="donut-center" id="donut-interes-center"></div>
            </div>
            <div class="donut-legend" id="donut-interes-legend"></div>
          </div>
        </div>
      </section>

      <section class="view" id="view-crm">
        <div class="tabs" id="crm-tabs">
          <button data-tab="leads" class="active">Todos los leads</button>
          <button data-tab="ases">Interesados en adhesión</button>
          <button data-tab="emerg">Emergencias sepelio</button>
          <button data-tab="interes">Interés sepelio</button>
        </div>
        <div class="crm-card">
          <div class="filters">
            <input type="text" id="crm-search" placeholder="Buscar por nombre, teléfono o localidad&hellip;">
            <label for="crm-estado">Filtrar</label>
            <select id="crm-estado"><option value="">Todos</option></select>
          </div>
          <div class="crm-wrap">
            <table class="crm-table" id="crm-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="pagination">
            <span id="crm-count"></span>
            <span>
              <button id="crm-prev">&larr; Anterior</button>
              <button id="crm-next">Siguiente &rarr;</button>
            </span>
          </div>
        </div>
      </section>

    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
